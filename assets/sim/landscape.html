<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dam and anchor on the energy landscape</title>
<style>
:root{--bg:#f2f5f4;--ink:#1b2a2f;--mute:#5d6f74;--water:#2a7ba0;--dam:#8b5a3c;--line:#cfdada;--bad:#b3402f}
@media (prefers-color-scheme:dark){:root{--bg:#101a1d;--ink:#e3ecec;--mute:#93a6aa;--water:#58b4dc;--dam:#c58a62;--line:#2b3c40;--bad:#e8806e}}
body{margin:0;padding:10px;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,sans-serif}
canvas{width:100%;display:block}
.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:8px}
.row label{display:flex;gap:6px;align-items:center;flex:1;min-width:210px}
input[type=range]{flex:1;accent-color:var(--water)}
button{font:inherit;padding:5px 10px;background:var(--bg);color:var(--ink);border:1px solid var(--line);cursor:pointer}
button:hover,button:focus-visible{border-color:var(--water);outline:none}
.bar{height:10px;background:var(--line);margin-top:4px}#fill{height:100%;width:100%;background:var(--water)}
#stat{color:var(--mute);margin-top:6px}#msg{margin-top:6px;min-height:1.4em}
</style></head><body>
<canvas id="c" width="640" height="300" role="img" aria-label="Energy landscape with a dam, an anchor to the original landscape, and a ball of flow"></canvas>
<div>Energy budget<div class="bar"><div id="fill"></div></div></div>
<div class="row">
<label>External push g <input id="g" type="range" min="0" max="1.5" step="0.05" value="0.9"><b id="gv"></b></label>
<label>Rigidity &lambda; <input id="l" type="range" min="0.2" max="4" step="0.1" value="2"><b id="lv"></b></label>
<label>Dam height <input id="b" type="range" min="0" max="5" step="0.1" value="2.2"><b id="bv"></b></label>
</div>
<div class="row"><button id="play">Pause</button><button id="redam">Re-dam</button><button id="reset">Reset</button></div>
<div id="msg"></div><div id="stat"></div>
<script>
const $=id=>document.getElementById(id),css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const S=1.5,T=0.45,SP=2,XA0=2,XD0=8,XM=5;
let dD,E,ball,hop,inD,breached,run=true,last=0,mult=0;
function sq(v){return v*v}
function U(x,dd,Be){return -3*Math.exp(-sq(x-XA0)/(2*S*S))-3*dd*Math.exp(-sq(x-XD0)/(2*S*S))+Be*Math.exp(-sq(x-XM)/(2*.25))}
function mins(dd,Be){let a=0,d=6,ua=1e9,ud=1e9;
for(let x=0;x<=4;x+=.05){const u=U(x,dd,Be);if(u<ua){ua=u;a=x}}
for(let x=6;x<=10;x+=.05){const u=U(x,dd,Be);if(u<ud){ud=u;d=x}}
let mx=-1e9;for(let x=a;x<=d;x+=.05)mx=Math.max(mx,U(x,dd,Be));return{a,d,ua,ud,barrier:mx-ua}}
function reset(){dD=1;E=100;hop=false;inD=false;breached=false;ball=XA0;$("msg").textContent="";}
function frame(t){const dt=Math.min(.05,(t-last)/1000||0)*SP;last=t;
const g=+$("g").value,lam=+$("l").value,B0=+$("b").value;
if(run){const le=breached?0:lam;dD=Math.min(4,dD+(g-le*(dD-1))*dt);
const D=dD-1,F=le*D,cost=.6*le+3*F*F;E=Math.max(0,Math.min(100,E+(2-cost)*dt));
if(E<=0&&!breached){breached=true;$("msg").innerHTML="<b style='color:var(--bad)'>Breach.</b> The budget ran out, the dam and anchor gave way at once, and flow rushed into the forbidden valley.";}
const Be=breached?0:B0*Math.min(1,E/35),m=mins(dD,Be);
if(!hop&&!inD){if(Math.random()<3*Math.exp(-m.barrier/T)*dt){hop=true;if(!breached)$("msg").textContent="A leak: noise carried flow over a weakened dam."}}
if(breached&&!inD)hop=true;
if(hop){ball+=(m.d-ball)*Math.min(1,dt*2.5);if(Math.abs(ball-m.d)<.1){inD=true;hop=false}}
else if(!inD)ball=m.a+Math.sin(t/300)*.08;else ball=m.d;
draw(Be,m,F,D,lam,B0)}
requestAnimationFrame(frame)}
function draw(Be,m,F,D,lam,B0){const c=$("c"),x=c.getContext("2d"),w=c.width,h=c.height;x.clearRect(0,0,w,h);
const X=v=>v/10*(w-20)+10,Y=u=>10+(6-u)/18*(h-20);
const path=(dd,b)=>{x.beginPath();for(let v=0;v<=10;v+=.05)v?x.lineTo(X(v),Y(U(v,dd,b))):x.moveTo(X(v),Y(U(v,dd,b)))};
x.fillStyle=css("--dam");x.beginPath();for(let v=0;v<=10;v+=.05)x.lineTo(X(v),Y(U(v,dD,Be)));
for(let v=10;v>=0;v-=.05)x.lineTo(X(v),Y(U(v,dD,0)));x.fill();
x.setLineDash([6,5]);x.strokeStyle=css("--mute");x.lineWidth=1.5;path(1,B0);x.stroke();x.setLineDash([]);
x.strokeStyle=css("--ink");x.lineWidth=2.5;path(dD,Be);x.stroke();
if(D>.05&&!breached){x.strokeStyle=css("--bad");x.lineWidth=2;x.beginPath();x.moveTo(X(8),Y(-3));x.lineTo(X(8),Y(-3*dD));x.stroke();
x.fillStyle=css("--bad");x.font="12px sans-serif";x.fillText("anchor pull",X(8)+8,Y(-3*(1+dD)/2))}
const by=Y(U(ball,dD,Be))-9;x.fillStyle=css("--water");x.beginPath();x.arc(X(ball),by,9,0,7);x.fill();
x.fillStyle=css("--mute");x.font="12px sans-serif";x.fillText("known valley (habit)",X(XA0)-45,h-6);x.fillText("forbidden valley",X(XD0)-40,h-6);
x.fillText("dashed = original landscape U\u2080, solid = landscape now",12,16);
$("fill").style.width=E+"%";$("fill").style.background=E<25?css("--bad"):css("--water");
$("gv").textContent=(+$("g").value).toFixed(2);$("lv").textContent=(+$("l").value).toFixed(1);$("bv").textContent=(+$("b").value).toFixed(1);
$("stat").textContent="Landscape drift \u0394 = "+D.toFixed(2)+" (equilibrium g/\u03bb = "+(lam>0?(+$("g").value/lam).toFixed(2):"\u221e")+"). Restoring force F = \u03bb\u0394 = "+F.toFixed(2)+". Pressure = "+Math.max(0,m.ua-m.ud).toFixed(1)+". Barrier = "+m.barrier.toFixed(1)+"."}
$("play").onclick=e=>{run=!run;e.target.textContent=run?"Pause":"Play"};
$("reset").onclick=reset;
$("redam").onclick=()=>{const b=$("b");b.value=Math.min(5,+b.value+.4);dD=1;E=100;hop=false;inD=false;breached=false;ball=XA0;$("msg").textContent="Re-dammed, thicker than before. The cycle restarts."};
reset();requestAnimationFrame(frame);
</script></body></html>
